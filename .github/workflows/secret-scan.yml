name: Secret scan
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan source in pinned Gitleaks container
        env:
          TOMI_CONTAINER_ENGINE: docker
        run: sh scripts/scan-container.sh source
      - name: Scan complete fetched history in pinned Gitleaks container
        env:
          TOMI_CONTAINER_ENGINE: docker
        run: sh scripts/scan-container.sh history
